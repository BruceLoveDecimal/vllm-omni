pipeline: lingbot_world
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: LingBotWorldCausalDMDPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: false
    streaming_output: false
    default_sampling_params:
      num_inference_steps: 4
      output_type: latent
      extra_args:
        flow_shift: 5.0
    model_config:
      ar_diffusion_height: 480
      ar_diffusion_width: 320
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.22
        warmup_cudagraph: false
      video_memory:
        window_frames: 18
        sink_frames: 3
        retrieval_frames: 3
        bank_bytes: 8589934592
        world_keep_ratio: 0.25
        pc_budget_frames: 12
        pc_recent_frames: 3
