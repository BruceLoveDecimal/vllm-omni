# SANA-WM I2V deploy: Stage-1 DiT + SANA VAE decode.
#
# model_class_name is an explicit override: the published checkpoint's
# model_index.json still names the two-stage class, which this build no longer
# registers.  skip_mm_profiling is required because diffusion_engine.py skips
# dummy_run for SanaWmPipeline.
#
# default_sampling_params mirror the NVlabs-recommended production inference
# config. See recipes/sana/SANA-WM.md for launch and request examples:
#   num_frames=161 (10 s @ 16 fps), num_inference_steps=60, guidance_scale=5.0,
#   seed=42, fps=16. CFG=5.0 is the real production knob; the native pipeline
#   honors guidance_scale via the CFG implementation. Callers can override any
#   of these per-request; defaults apply only when unset.
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enforce_eager: true
    skip_mm_profiling: true
    devices: "0"
    engine_args:
      model_class_name: "SanaWmPipeline"
    default_sampling_params:
      seed: 42
      height: 704
      width: 1280
      num_frames: 161
      fps: 16
      num_inference_steps: 60
      guidance_scale: 5.0
