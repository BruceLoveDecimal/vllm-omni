# SANA-WM I2V deploy: Stage-1 DiT + SANA VAE decode.
#
# No model_class_name override: the Stage-1 repo's model_index.json names
# SanaWmPipeline, so enrich_config resolves the class on its own. See
# SANA_WM_MODEL_ID in models/sana_wm/pipeline_sana_wm.py. skip_mm_profiling is
# required because SanaWmPipeline sets dummy_run_num_frames = 0, so the startup
# dummy run generates no frames to profile against.
#
# default_sampling_params mirror the NVlabs-recommended production inference
# config. See recipes/NVIDIA/SANA-WM.md for launch and request examples:
#   num_frames=161 (10 s @ 16 fps), num_inference_steps=60, guidance_scale=5.0,
#   seed=42, fps=16. CFG=5.0 is the real production knob; the native pipeline
#   honors guidance_scale via the CFG implementation. Callers can override any
#   of these per-request; defaults apply only when unset.
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enforce_eager: true
    skip_mm_profiling: true
    devices: "0"
    # The SANA VAE decodes a 161-frame clip about 9 GiB cheaper with tiling on,
    # and needs it outright for longer requests.
    vae_use_tiling: true
    default_sampling_params:
      seed: 42
      height: 704
      width: 1280
      num_frames: 161
      fps: 16
      num_inference_steps: 60
      guidance_scale: 5.0
