# SANA-WM I2V deploy: single-stage (Stage-1 DiT + LTX-2 refiner, native smoke path).
#
# model_class_name must be set here because the SANA-WM HF repo has no
# model_index.json; data.py detects the layout heuristically but allows the
# yaml to override.  skip_mm_profiling is required because diffusion_engine.py
# skips dummy_run for SanaWmTwoStagesPipeline.
#
# default_sampling_params mirror the NVlabs-recommended production inference
# config (see docs/design/feature/sana_wm_integration.md
# "NVlabs-Recommended Production Inference Config"):
#   num_frames=161 (10 s @ 16 fps), num_inference_steps=60, guidance_scale=5.0,
#   seed=42, fps=16. CFG=5.0 is the real production knob; the native pipeline
#   now honors guidance_scale via the §6.14u CFG implementation. Callers can
#   override any of these per-request; defaults apply only when unset.
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enforce_eager: true
    skip_mm_profiling: true
    devices: "0"
    engine_args:
      model_class_name: "SanaWmTwoStagesPipeline"
    default_sampling_params:
      seed: 42
      height: 704
      width: 1280
      num_frames: 161
      fps: 16
      num_inference_steps: 60
      guidance_scale: 5.0
