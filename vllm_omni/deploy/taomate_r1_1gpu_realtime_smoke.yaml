# TaoMate-R1 single-GPU capacity smoke (realtime /v1/realtime/video).
# Not the release configuration: FP8 per-channel DiT linears, a 480x864 canvas,
# references resized to a 768-pixel short edge, and the Qwen3-VL text encoder
# streamed layer by layer from host memory. On one GPU the clean K/V history
# keeps all 56 heads, so use an H200-class (141 GB) card. Launch with:
#   --diffusion-offload-config '{"mode":"layer","components":["text_encoder"]}'
# See recipes/TaoLiveAIGC/TaoMate-R1.md ("Single-GPU smoke").

pipeline: taomate_r1
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    quantization:
      transformer:
        method: fp8_per_channel
        ignore:
          - "*patch_proj*"
          - "*condition_proj*"
          - "*time_embedder*"
          - "*token_refiner*"
          - "*final_layer*"
          - "*adaln_proj*"
      text_encoder: null
    model_class_name: TaoMateR1Pipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: true
    streaming_output: true
    parallel_config:
      tensor_parallel_size: 1
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      text_encoder_tp_size: 1
    default_sampling_params:
      num_inference_steps: 3
      output_type: np
      fps: 24
    model_config:
      taomate_r1_width: 480
      taomate_r1_height: 864
      taomate_r1_seed: 42
      taomate_r1_default_frames: 107
      taomate_r1_reference_short_edge: 768
      taomate_h3_vae_decoder_tile_overlap_min: 32
      taomate_h3_vae_stack_tiling: true
      taomate_h3_adaln_cache: false
      taomate_h3_log_timings: true
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.02
        warmup_cudagraph: true
