# AuK deploy: thinker encoder (stage 0) + rectified-flow DiT (stage 1) +
# codec decoder (stage 2).
# Topology declared in vllm_omni/model_executor/models/auk/pipeline.py.
#
# Fields omitted from a stage fall back to StageDeployConfig dataclass
# defaults (see vllm_omni/config/stage_config.py). trust_remote_code,
# enable_prefix_caching and enable_chunked_prefill are pipeline-wide
# DeployConfig fields and apply to both stages.
#
# The ODE runs over the whole target segment, so there is nothing to stream
# between the stages: async_chunk stays off.
async_chunk: false
trust_remote_code: true
# Prefix caching must stay off: a cache hit skips the prefix positions, and
# the fused [tokens, 2048] condition needs every position of the prompt.
# Chunked prefill works (the runner concatenates the per-chunk hidden states)
# but measured no wall-time gain, since the encoder is a few percent of a
# request, and it costs bit-exact reproducibility across scheduling.
enable_prefix_caching: false
enable_chunked_prefill: false

stages:
  # Stage 0: Qwen2.5-Omni thinker as a frozen text encoder.
  # Prefill only — one sampled token, discarded downstream. eager because the
  # fused-hidden forward walks the decoder layers itself and so bypasses the
  # compiled graph.
  - stage_id: 0
    devices: "0"
    max_num_seqs: 8
    gpu_memory_utilization: 0.45
    enforce_eager: true
    max_num_batched_tokens: 32768
    # AuK takes text plus at most one clip; no image or video tower is built.
    limit_mm_per_prompt: {audio: 1}
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1
      detokenize: false
      seed: 0

  # Stage 1: AuKLatentPipeline (DiT plus the VAE encoder for the source clip;
  # emits latents).
  # Shares GPU 0 with the encoder; 32 Euler steps at CFG 2.0 is the Base
  # recipe, and AuK-Flash overrides both with its distilled 4-step grid.
  # Concurrent requests share one DiT forward as rows of a padded batch (the
  # scheduler only batches requests with the same schedule), so the DiT's
  # per-step launch cost is amortised across up to max_num_seqs requests.
  # max_num_seqs is the whole batching policy: the pipeline pads every row
  # to the longest one and never splits the batch. Eight suits short,
  # reference-free rows (about 5 s targets keep gaining up to eight rows);
  # long voice-clone rows (5 s target plus a 6 s reference) are
  # compute-bound at one row and only pay for padding, so a deployment
  # serving mostly those should lower it to 2-4.
  # request_batch_max_wait_ms lets an idle engine hold the first arrival
  # briefly to collect a burst; once a batch is in flight, later arrivals
  # queue and form the next batch without waiting.
  # step_execution advances every active request one Euler step per
  # scheduler tick, so a request joins the DiT batch at the next step boundary
  # instead of waiting for the batch in flight. Off by default: measured on
  # AuK-Flash under Poisson arrivals and at saturation it matched or trailed
  # request batching by up to 10% (the 4-step ODE makes a whole batch only
  # about 100 ms of waiting, while the per-step re-batching costs more than
  # that saves). Turn it on for long schedules (the 32-step base recipe) where
  # waiting for a whole batch costs seconds.
  - stage_id: 1
    devices: "0"
    max_num_seqs: 8
    step_execution: false
    request_batch_max_wait_ms: 10
    gpu_memory_utilization: 0.30
    enforce_eager: false
    default_sampling_params:
      seed: 0
      num_inference_steps: 32
      guidance_scale: 2.0

  # Stage 2: AuKVocoderPipeline (BigVGAN-flow VAE decoder). Its own stage so
  # clip rendering overlaps the next batch's DiT steps. One clip per decode
  # call: a batched decode measured slower per clip than one call each, so
  # max_num_seqs stays at 1.
  - stage_id: 2
    devices: "0"
    max_num_seqs: 1
    gpu_memory_utilization: 0.05
    enforce_eager: true
