# Experimental full-request two-stage handoff, not realtime chunk transport.
# Both workers share GPU 0. No memory/latency improvement is claimed.
pipeline: hy_nomas_two_stage
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: HyNomasDenoisePipeline
    diffusion_attention_config:
      default:
        backend: TORCH_SDPA
    diffusion_offload_config:
      mode: module
      components: [text_encoder]
    default_sampling_params:
      num_inference_steps: 8
      guidance_scale: 1.0
      num_frames: 240
      fps: 24
    model_config:
      ar_diffusion_height: 704
      ar_diffusion_width: 1280
      hy_nomas_segment_latent_frames: 30
      hy_nomas_max_segments: 2
  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: HyNomasDecodePipeline
    diffusion_attention_config:
      default:
        backend: TORCH_SDPA
    default_sampling_params:
      output_type: pil
      fps: 24
