# TaoMate-R1 streaming: MiniMax-H3 Ref2VA + opening/continuation LoRA banks.
# USP4, tensor parallel 1, BF16 weights. Point the model at MiniMax-H3/Ref2VA
# and --lora-path at the TaoMate-R1 directory (the one holding config.json,
# cold/ and warm/). Launch commands and validation: recipes/TaoLiveAIGC/TaoMate-R1.md.
# Warmup runs one three-chunk session (cold, warm, terminal) before serving.

pipeline: taomate_r1
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: TaoMateR1Pipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: true
    streaming_output: true
    parallel_config:
      tensor_parallel_size: 1
      sequence_parallel_size: 4
      ulysses_degree: 4
      ring_degree: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
    default_sampling_params:
      num_inference_steps: 3
      output_type: np
      fps: 24
    model_config:
      taomate_r1_width: 768
      taomate_r1_height: 1344
      taomate_r1_seed: 42
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.02
        warmup_cudagraph: true
